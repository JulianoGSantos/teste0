<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encontre Seu Medicamento | FQM</title>
    <!-- Tailwind CSS CDN para renderização estática sem erros de build -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex justify-center items-start sm:items-center p-0 sm:p-4">

    <!-- Container do App Mobile -->
    <div class="w-full max-w-md bg-white min-h-screen sm:min-h-0 sm:rounded-3xl sm:shadow-2xl overflow-hidden flex flex-col justify-between">
        
        <!-- Cabeçalho -->
        <header class="bg-white border-b border-gray-100 p-4 flex items-center justify-between sticky top-0 z-10">
            <div class="flex items-center gap-2">
                <span class="bg-red-600 text-white font-black text-xs px-2 py-1 rounded tracking-widest">FQM</span>
                <span class="text-xs text-gray-500 font-medium">Localizador de Medicamentos</span>
            </div>
            <span class="text-xs bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-full font-semibold border border-emerald-200">
                Amostra Grátis
            </span>
        </header>

        <!-- Conteúdo Dinâmico do Produto -->
        <main class="p-5 flex-1 flex flex-col items-center text-center justify-center">
            
            <!-- Imagem do Medicamento -->
            <div class="w-full bg-gray-50 rounded-2xl p-4 mb-4 flex items-center justify-center border border-gray-100 min-h-[220px]">
                <img id="prod-img" src="" alt="Caixa do Medicamento" class="max-h-48 object-contain drop-shadow-md hidden">
                <div id="img-skeleton" class="animate-pulse flex space-x-4">
                    <div class="h-40 w-40 bg-gray-200 rounded-lg"></div>
                </div>
            </div>

            <!-- Detalhes do Produto -->
            <h1 id="prod-title" class="text-2xl font-extrabold text-gray-900 tracking-tight">Carregando...</h1>
            <p id="prod-sub" class="text-sm font-medium text-gray-500 mt-1">Aguarde um momento</p>

            <div class="w-full my-6 border-t border-gray-100"></div>

            <!-- Botões de Ação / Farmácias -->
            <div class="w-full space-y-3">
                <p class="text-xs font-bold text-gray-400 uppercase tracking-wider text-left mb-2">Encontre nas Drogarias Proximas:</p>
                
                <a id="btn-drogasil" href="#" target="_blank" rel="noopener noreferrer" 
                   class="flex items-center justify-between w-full bg-red-50 hover:bg-red-100 text-red-700 font-bold py-3.5 px-4 rounded-xl transition border border-red-200 text-sm">
                   <span>Buscar na Drogasil</span>
                   <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </a>

                <a id="btn-paguemenos" href="#" target="_blank" rel="noopener noreferrer" 
                   class="flex items-center justify-between w-full bg-blue-50 hover:bg-blue-100 text-blue-800 font-bold py-3.5 px-4 rounded-xl transition border border-blue-200 text-sm">
                   <span>Buscar na Pague Menos</span>
                   <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </a>

                <a id="btn-drogaria-raia" href="#" target="_blank" rel="noopener noreferrer" 
                   class="flex items-center justify-between w-full bg-emerald-50 hover:bg-emerald-100 text-emerald-800 font-bold py-3.5 px-4 rounded-xl transition border border-emerald-200 text-sm">
                   <span>Buscar na Droga Raia</span>
                   <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </a>
            </div>

        </main>

        <!-- Rodapé -->
        <footer class="p-4 text-center border-t border-gray-100 bg-gray-50">
            <p class="text-[11px] text-gray-400">
                Consulte sempre seu médico. Venda sob prescrição médica.
            </p>
        </footer>

    </div>

    <!-- Script de Identificação da Rota do QR Code -->
    <script>
        // Banco de dados estático dos produtos
        const produtos = {
            'rosa': {
                nome: 'ROSA® (rosuvastatina cálcica)',
                dosagem: '20mg — Comprimidos Revestidos',
                imagem: 'build/assets/rosa-20mg.jpg', // Coloque o caminho relativo da imagem da caixa
                drogasil: 'https://www.drogasil.com.br/busca?q=rosa+rosuvastatina+20mg',
                paguemenos: 'https://www.paguemenos.com.br/busca?q=rosa+rosuvastatina+20mg',
                drogaraia: 'https://www.drogaraia.com.br/busca?q=rosa+rosuvastatina+20mg'
            },
            'laio': {
                nome: 'LAIO® (hemifumarato de bisoprolol)',
                dosagem: 'Bisoprolol — Uso Oral',
                imagem: 'build/assets/laio.jpg',
                drogasil: 'https://www.drogasil.com.br/busca?q=laio+bisoprolol',
                paguemenos: 'https://www.paguemenos.com.br/busca?q=laio+bisoprolol',
                drogaraia: 'https://www.drogaraia.com.br/busca?q=laio+bisoprolol'
            }
        };

        // Captura o nome da rota na URL (ex: /rosa ou /laio)
        const path = window.location.pathname.replace(/^\/|\/$/g, '').toLowerCase();
        
        // Seleciona o produto correspondente ou carrega 'rosa' por padrão
        const produtoAtual = produtos[path] || produtos['rosa'];

        // Atualiza a interface
        document.getElementById('prod-title').innerText = produtoAtual.nome;
        document.getElementById('prod-sub').innerText = produtoAtual.dosagem;
        
        const imgEl = document.getElementById('prod-img');
        const skeletonEl = document.getElementById('img-skeleton');
        
        imgEl.src = produtoAtual.imagem;
        imgEl.onload = () => {
            skeletonEl.classList.add('hidden');
            imgEl.classList.remove('hidden');
        };
        // Exibe a imagem caso o carregamento já tenha ocorrido
        if (imgEl.complete) {
            skeletonEl.classList.add('hidden');
            imgEl.classList.remove('hidden');
        }

        // Atualiza os links dos botões das farmácias
        document.getElementById('btn-drogasil').href = produtoAtual.drogasil;
        document.getElementById('btn-paguemenos').href = produtoAtual.paguemenos;
        document.getElementById('btn-drogaria-raia').href = produtoAtual.drogaraia;
    </script>
</body>
</html>
